% rebase('base.html', title='File browser')
<h2>Files</h2>
<p class="sub">Download files from the DATA partition of the SD card (ADI log, screenshots, recordings, etc).</p>
<div class="card files">
<a href=".."><i class="si-folder"></i> ..</a>
% for item in dirs:
<a href="{{item}}/"><i class="si-folder"></i> {{item}}</a>
% end
% for item in files:
<a href="{{item}}"><i class="si-file"></i> {{item}}</a>
% end
</div>
