% rebase('base.html', title='wfview')
<h2>wfview server</h2>
<p class="sub">Lets <a href="https://wfview.org">wfview</a> on a PC control the radio over the network like an Icom IC-705 (CI-V, RX audio, waterfall). In wfview: radio IP, control port 50001, audio LPCM 1ch 16bit. The radio applies changes within a few seconds.</p>

<form class="card" id="conf">
  <h3>Server</h3>
  <div class="grid" style="grid-template-columns:auto 1fr 1fr">
    <div><label for="enabled">Enabled</label><input id="enabled" type="checkbox"></div>
    <div><label for="user">User</label><input id="user" autocomplete="off" required maxlength="15" pattern="[ -<>-~]{1,15}"></div>
    <div><label for="pass">Password</label><input id="pass" type="password" autocomplete="off" required maxlength="15" pattern="[ -<>-~]{1,15}"></div>
  </div>
  <div class="actions">
    <button type="submit" class="primary">Save</button>
    <span class="status" id="status"></span>
  </div>
</form>

<script>
var showStatus = function(text, error=false) {
  const el = $("#status");
  el.toggleClass("error", error);
  el.html('<span class="dot"></span>').append(document.createTextNode(text));
}

var render = function(data) {
  $("#enabled").prop("checked", data.enabled);
  $("#user").val(data.user);
  $("#pass").val(data.pass);
}

$.get('/api/wfview', {}, render);

$("#conf").on("submit", function(e) {
  e.preventDefault();
  $.ajax({
    url: "/api/wfview",
    type: "POST",
    data: JSON.stringify({enabled: $("#enabled").prop("checked"), user: $("#user").val().trim(), pass: $("#pass").val()}),
    contentType: "application/json; charset=utf-8",
    dataType: "json",
    success: function(r) { render(r); showStatus("Saved"); },
    error: function(xhr) { showStatus(xhr.responseJSON ? xhr.responseJSON.msg : "Save failed", true); }
  });
});
</script>
