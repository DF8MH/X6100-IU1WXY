% rebase('base.html', title='DX Cluster')
<h2>DX Cluster</h2>
<p class="sub">Servers the radio can use (APP → Cluster). The one in use is marked; the radio reconnects when you change it.</p>

<div class="card">
<div class="table-wrap">
<table id="servers">
  <thead>
    <tr><th>Name</th><th>Host</th><th>Port</th><th></th></tr>
  </thead>
  <tbody></tbody>
</table>
</div>
</div>

<form class="card" id="add">
  <h3>Add server</h3>
  <div class="grid" style="grid-template-columns:1fr 2fr 120px">
    <div><label for="name">Name</label><input id="name" autocomplete="off" required maxlength="31" pattern="[^|]+"></div>
    <div><label for="host">Host</label><input id="host" autocomplete="off" required pattern="[A-Za-z0-9.\-]{1,127}" maxlength="127"></div>
    <div><label for="port">Port</label><input id="port" type="number" min="1" max="65535" value="23" required></div>
  </div>
  <div class="actions">
    <button type="submit" class="primary">Add server</button>
    <span class="status" id="status"></span>
  </div>
</form>

<script>
var showStatus = function(text, error=false) {
  const el = $("#status");
  el.toggleClass("error", error);
  el.html('<span class="dot"></span>').append(document.createTextNode(text));
}

var render = function(data) {
  const body = $("#servers>tbody").empty();
  data.servers.forEach(function(s, i) {
    const inUse = s.host == data.host && s.port == data.port;
    const row = $("<tr>");
    row.append($("<td>").text(s.name).append(inUse ? ' <span class="tag">in use</span>' : ''));
    row.append($("<td>").text(s.host));
    row.append($("<td>").text(s.port));
    const actions = $("<td class='action-cell'>");
    if (!inUse) actions.append($("<button class='ghost'>Use</button>").on("click", function() { call("POST", "/api/cluster/use/" + i); }));
    if (!inUse) actions.append(" ", $("<button class='ghost'>Delete</button>").on("click", function() { call("DELETE", "/api/cluster/servers/" + i); }));
    body.append(row.append(actions));
  });
}

var call = function(type, url, payload) {
  $.ajax({
    url: url,
    type: type,
    data: payload ? JSON.stringify(payload) : undefined,
    contentType: "application/json; charset=utf-8",
    dataType: "json",
    success: function(r) { render(r); showStatus("Saved"); },
    error: function(xhr) { showStatus(xhr.responseJSON ? xhr.responseJSON.msg : "Save failed", true); }
  });
}

$.get('/api/cluster', {}, render);

$("#add").on("submit", function(e) {
  e.preventDefault();
  call("POST", "/api/cluster/servers",
       {name: $("#name").val().trim(), host: $("#host").val().trim(), port: Number($("#port").val())});
  $("#name, #host").val("");
});
</script>
